<style>
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; }
  .dru-error { color: #ff6300; display: none; }
</style>

<p data-i18n="pair.intro"></p>
<div class="form-group">
  <label for="address" data-i18n="pair.address"></label>
  <input type="text" id="address" placeholder="192.168.1.50">
</div>
<div class="form-group">
  <label for="port" data-i18n="pair.port"></label>
  <input type="number" id="port" value="502">
</div>
<div class="form-group">
  <label for="polling" data-i18n="pair.polling"></label>
  <input type="number" id="polling" min="5" max="3600" value="10">
</div>
<button id="connect" class="homey-button-primary-full" data-i18n="pair.connect"></button>
<p class="dru-error" id="error"></p>

<script type="application/javascript">
  Homey.setTitle(Homey.__('pair.title'));

  document.getElementById('connect').addEventListener('click', () => {
    const errorEl = document.getElementById('error');
    const address = document.getElementById('address').value.trim();
    const port = Number(document.getElementById('port').value);
    const polling = Number(document.getElementById('polling').value);

    if (!address || !port || !polling) {
      errorEl.textContent = Homey.__('pair.nosettings');
      errorEl.style.display = 'block';
      return;
    }

    Homey.createDevice({
      name: Homey.__('pair.devicename'),
      data: { id: address },
      settings: { address, port, polling },
    })
      .then(() => Homey.done())
      .catch((err) => {
        errorEl.textContent = err.message || String(err);
        errorEl.style.display = 'block';
      });
  });
</script>
